[package]
name = "http_proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
http_wire = "0.8.0"
http = "1.5.0"
bytes = "1.12.1"
reqwest = "0.13.5"
tokio = { version = "1.53.1", features = ["full"]}
httparse = "1.10.1"
async-std = "1.13.2"
http-body = "1.1.0"
http-body-util = "0.1.5"
clap = {version = "4.6.7", features = ["derive"]}
regex = "1.13.1"
sysinfo = "0.39.6"
phf = {version = "0.14.0", features = ["macros"]}
colog = "1.4.0"
log = "0.4.34"
